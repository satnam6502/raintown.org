name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - "_site/**"
      - "vendor/**"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for raintown.org, a Jekyll static
            site (Markdown posts in _posts/, layouts in _layouts/, assets in
            images/ and topic directories). _site/ is build output and should
            not be committed.

            Review the diff and focus on:
            - Broken or suspicious links and image paths (check referenced files exist)
            - Invalid YAML front matter or Liquid template errors
            - Malformed HTML/Markdown that would render incorrectly
            - Mixed-content (http://) resources, dead third-party scripts, or
              anything that leaks secrets or personal data
            - Accessibility basics (missing alt text, heading order)
            - Typos and factual inconsistencies in prose

            Be concise. Only raise issues you are confident about. Use inline
            comments (mcp__github_inline_comment__create_inline_comment) for
            specific lines, and `gh pr comment` for a short overall summary.
            If there is nothing worth flagging, post a one-line summary saying so.

          claude_args: |
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
